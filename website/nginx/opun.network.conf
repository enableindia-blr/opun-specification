# opun.network: OPuN website and JSON-LD schemas (static).
# CloudFront (TLS for opun.network, www.opun.network) -> origin opun-site-origin.opun.network
# -> this server on port 80. Files are published by website/deploy.sh.
server {
    listen 80;
    server_name opun.network www.opun.network opun-site-origin.opun.network;

    root /var/www/opun.network/current;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    # JSON-LD contexts and vocabularies: correct media type, open CORS for JSON-LD processors
    location ~ \.jsonld$ {
        limit_except GET HEAD { deny all; }
        types { } default_type application/ld+json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~ \.ya?ml$ {
        limit_except GET HEAD { deny all; }
        types { } default_type "text/yaml; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
